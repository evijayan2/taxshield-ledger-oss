name: Deploy to Vercel Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  TAXPACK_SERVER_URL: ${{ vars.TAXPACK_SERVER_URL || 'https://tax-rule-packaging-engine.vercel.app' }}
  TAX_PACKAGE_SERVER_URL: ${{ vars.TAXPACK_SERVER_URL || 'https://tax-rule-packaging-engine.vercel.app' }}

jobs:
  ci-gate:
    name: Verify CI Gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/taxshield_ledger?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: taxshield_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Shared Core
        run: git clone https://github.com/evijayan2/taxshield-ledger-core.git ../shared-core

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          (cd ../shared-core && pnpm install --no-frozen-lockfile && pnpm exec prisma generate)
          pnpm install --no-frozen-lockfile
          pnpm exec prisma generate

      - name: Setup Database Schema
        run: pnpm exec prisma db push --skip-generate

      - name: Run Linter & Type Check
        run: pnpm lint

      - name: Build Application
        run: pnpm build

      - name: Run Test Suite
        run: pnpm test

  deploy:
    name: Deploy to Vercel Production
    needs: ci-gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TAXPACK_SERVER_URL: ${{ vars.TAXPACK_SERVER_URL || 'https://tax-rule-packaging-engine.vercel.app' }}
      TAX_PACKAGE_SERVER_URL: ${{ vars.TAXPACK_SERVER_URL || 'https://tax-rule-packaging-engine.vercel.app' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Shared Core
        run: git clone https://github.com/evijayan2/taxshield-ledger-core.git ../shared-core

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          (cd ../shared-core && pnpm install --no-frozen-lockfile && pnpm exec prisma generate)
          pnpm install --no-frozen-lockfile
          pnpm exec prisma generate

      - name: Build Application
        run: pnpm build

      - name: Validate Vercel Secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "::error::Missing Vercel secrets in GitHub Repository Secrets!"
            echo "::error::Please configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

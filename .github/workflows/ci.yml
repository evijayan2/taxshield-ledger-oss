name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DATABASE_URL: "postgresql://postgres:password@localhost:5432/taxshield_ledger?schema=public"

jobs:
  test:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: taxshield_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Shared Core
        run: git clone https://github.com/evijayan2/taxshield-ledger-core.git ../shared-core

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          (cd ../shared-core && pnpm install --no-frozen-lockfile && pnpm exec prisma generate)
          pnpm install --no-frozen-lockfile
          pnpm exec prisma generate

      - name: Setup Database Schema
        run: pnpm exec prisma db push --skip-generate

      - name: Run Linter & Type Check
        run: pnpm lint

      - name: Run Test Suite
        run: pnpm test

      - name: Build Application
        run: pnpm build
